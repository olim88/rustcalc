[package]
name = "rust-calculator"
version = "0.1.0"
edition = "2024"
description = "LaTeX-in / LaTeX-out calculator core for the Obsidian plugin"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rust-calc"
path = "src/bin/rust-calc.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
mathlex = "0.4.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
